<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1214">
<title>立山旅行 8/22-23</title>
<meta property="og:title" content="立山旅行 8/22-23｜好みを選ぶだけでプランができます">
<meta property="og:description" content="6つの質問に答えるだけ。あなたの行きたいプランができます。">
<style>
:root{
  --bg:#0f1214; --sf:#191e21; --sf2:#222a2e; --bd:#2c3438; --bd2:#3d474d;
  --tx:#f0f2f3; --mu:#9aa4a9; --mu2:#6f797e;
  --ac:#f0a92e; --acd:#2a2113; --rd:#e07a70;
  --pad:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- top bar ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--bg);
  padding:env(safe-area-inset-top) 0 0}
#top .in{display:flex;align-items:center;gap:10px;height:52px;padding:0 12px;
  max-width:620px;margin:0 auto}
#back{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:1.35rem;color:var(--mu);flex:none}
#back:active{background:var(--sf)}
#back.hide{visibility:hidden}
#pg{flex:1;height:4px;background:var(--sf2);border-radius:99px;overflow:hidden}
#pg i{display:block;height:100%;background:var(--ac);border-radius:99px;
  transition:width .35s cubic-bezier(.4,0,.2,1);width:0}
#cnt{font-size:.8rem;color:var(--mu2);font-variant-numeric:tabular-nums;flex:none;min-width:34px;text-align:right}

/* ---------- page ---------- */
main{max-width:620px;margin:0 auto;padding:70px var(--pad) 130px}
.qh{margin:6px 0 20px}
.qh h1{font-size:1.5rem;line-height:1.4;margin:0;font-weight:700;letter-spacing:-.01em}
.qh p{margin:8px 0 0;color:var(--mu);font-size:.92rem;line-height:1.6}

/* ---------- choice rows ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--sf);border:2px solid var(--sf);border-radius:14px;
  padding:14px 16px;transition:border-color .12s,background .12s}
.row:active{background:var(--sf2)}
.row.sel{border-color:var(--ac);background:var(--acd)}
.row .em{font-size:1.7rem;flex:none;line-height:1}
.row .tx{flex:1;min-width:0;display:block}
.row .t1{display:block;font-size:1.02rem;font-weight:700;line-height:1.45}
.row .t2{display:block;font-size:.85rem;color:var(--mu);line-height:1.5;margin-top:2px}
.row .mk{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd2);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:900;color:transparent}
.row.sel .mk{background:var(--ac);border-color:var(--ac);color:var(--acd)}

/* ---------- photo cards ---------- */
.cards{display:flex;flex-direction:column;gap:11px}
.pc{display:flex;gap:0;width:100%;text-align:left;background:var(--sf);
  border:2px solid var(--sf);border-radius:14px;overflow:hidden;transition:border-color .12s}
.pc:active{background:var(--sf2)}
.pc.sel{border-color:var(--ac)}
.pc .im{width:112px;flex:none;background:var(--sf2);position:relative;overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover;min-height:100px}
.pc .bd{flex:1;min-width:0;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:10px}
.pc .tx{flex:1;min-width:0;display:block}
.pc .t1{display:block;font-size:1rem;font-weight:700;line-height:1.4}
.pc .t2{display:block;font-size:.82rem;color:var(--ac);margin-top:3px;font-variant-numeric:tabular-nums}
.pc .t3{display:block;font-size:.79rem;color:var(--mu);margin-top:3px;line-height:1.45}
.pc .mk{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd2);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:900;color:transparent}
.pc.sel .mk{background:var(--ac);border-color:var(--ac);color:var(--acd)}
.pc .osusume{position:absolute;top:0;left:0;background:var(--ac);color:var(--acd);
  font-size:.66rem;font-weight:800;padding:2px 7px;border-bottom-right-radius:8px;letter-spacing:.03em}

/* ---------- bottom ---------- */
#bot{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(180deg,rgba(15,18,20,0),var(--bg) 26%);
  padding:26px var(--pad) calc(16px + env(safe-area-inset-bottom))}
#bot .in{max-width:620px;margin:0 auto}
.big{width:100%;background:var(--ac);color:var(--acd);border-radius:14px;
  padding:16px;font-size:1.05rem;font-weight:800;letter-spacing:.02em}
.big:active{opacity:.82}
.big[disabled]{background:var(--sf2);color:var(--mu2)}
.skip{width:100%;text-align:center;color:var(--mu);font-size:.87rem;padding:13px 0 2px}
.skip:active{color:var(--tx)}

/* ---------- welcome ---------- */
#hero{margin:-70px calc(var(--pad)*-1) 0;height:44vh;min-height:230px;max-height:340px;
  position:relative;overflow:hidden}
#hero img{width:100%;height:100%;object-fit:cover;opacity:.62}
#hero .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 var(--pad) 22px;background:linear-gradient(180deg,rgba(15,18,20,.35),rgba(15,18,20,.55) 45%,var(--bg))}
#hero .dt{color:var(--ac);font-size:.82rem;font-weight:800;letter-spacing:.1em}
#hero h1{font-size:2rem;margin:4px 0 0;line-height:1.25;font-weight:800}
#hero .sb{color:#d3dade;font-size:.92rem;margin-top:6px}
.lead{margin:22px 0 0}
.lead p{margin:0 0 14px;font-size:1rem;line-height:1.75}
.lead .num{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px}
.lead .num b{width:26px;height:26px;border-radius:50%;background:var(--sf2);color:var(--ac);
  font-size:.82rem;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.lead .num span{font-size:.95rem;color:var(--mu);line-height:1.6}
.lead .num span i{font-style:normal;color:var(--tx)}

/* ---------- result ---------- */
.rz{text-align:center;padding:6px 0 4px}
.rz .ok{font-size:2.6rem;line-height:1}
.rz h1{font-size:1.45rem;margin:10px 0 0;font-weight:800}
.rz p{color:var(--mu);font-size:.9rem;margin:6px 0 0}
.plan{background:var(--sf);border-radius:16px;padding:18px;margin:20px 0 0}
.plan .lb{font-size:.74rem;color:var(--mu2);letter-spacing:.09em;font-weight:700}
.plan .v1{font-size:1.22rem;font-weight:800;line-height:1.4;margin-top:3px}
.plan .v2{font-size:.87rem;color:var(--mu);margin-top:3px}
.plan hr{border:none;border-top:1px solid var(--bd);margin:15px 0}
.money{display:flex;align-items:baseline;gap:8px;margin-top:3px}
.money b{font-size:1.9rem;color:var(--ac);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.money span{font-size:.85rem;color:var(--mu)}

h2.s{font-size:1.02rem;font-weight:800;margin:30px 0 12px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:13px;padding:9px 0;border-bottom:1px solid #1e2427}
.tl li:last-child{border:none}
.tl .tm{flex:none;width:82px;color:var(--ac);font-size:.83rem;font-weight:700;
  font-variant-numeric:tabular-nums;padding-top:1px}
.tl .ac{flex:1;font-size:.94rem;line-height:1.5}
.dayl{font-size:.8rem;font-weight:800;color:var(--mu);background:var(--sf);
  padding:7px 12px;border-radius:8px;margin:16px 0 6px}
.dayl:first-child{margin-top:0}

.note{display:flex;gap:11px;background:var(--sf);border-radius:12px;padding:13px 15px;
  margin:9px 0;font-size:.9rem;line-height:1.6;color:var(--mu)}
.note.w{background:#2a1c1b;color:#f0cbc6}
.note .i{flex:none;font-size:1rem;line-height:1.5}
.note b{color:var(--tx)}

.pills{display:flex;flex-wrap:wrap;gap:7px}
.pills span{background:var(--sf);border-radius:99px;padding:6px 14px;font-size:.85rem;color:var(--mu)}

.acts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.acts button{width:100%;padding:15px;border-radius:13px;font-size:.98rem;font-weight:700;
  background:var(--sf);color:var(--tx)}
.acts button.p{background:var(--ac);color:var(--acd);font-weight:800}
.acts button:active{opacity:.82}
.foot{text-align:center;margin:32px 0 0;font-size:.83rem;color:var(--mu2);line-height:2}
.foot a{color:var(--mu);text-decoration:none;border-bottom:1px solid var(--bd2)}

#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,10px);
  background:var(--tx);color:var(--bg);padding:11px 22px;border-radius:99px;
  font-size:.9rem;font-weight:800;z-index:99;opacity:0;pointer-events:none;transition:.22s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#ta{position:fixed;left:-9999px;top:0}
@media(min-width:620px){ .pc .im{width:150px} }
</style>
</head>

function wURL(){ if(BOOT)return; var p=[];
  if(S.g)p.push('g='+S.g); if(S.e)p.push('e='+S.e); if(S.y)p.push('y='+S.y);
  if(S.h)p.push('h='+S.h); if(S.s)p.push('s='+S.s);
  if(S.on.length)p.push('o='+S.on.join('.')); if(S.fd.length)p.push('f='+S.fd.join('.'));
  if(S.sp.length)p.push('p='+S.sp.join('.')); p.push('i='+IDX);
  history.replaceState(null,'','#'+p.join('&'))}
function rURL(){ var hs=location.hash.replace(/^#/,''); if(!hs)return false; var ok=false;
  hs.split('&').forEach(function(kv){var a=kv.split('='),k=a[0],v=decodeURIComponent(a[1]||''); if(!v)return;
    if(k==='g'){S.g=v;ok=true} else if(k==='e'){S.e=+v;ok=true} else if(k==='y'){S.y=v;ok=true}
    else if(k==='h')S.h=v; else if(k==='s')S.s=v;
    else if(k==='o')S.on=v.split('.'); else if(k==='f')S.fd=v.split('.');
    else if(k==='p')S.sp=v.split('.'); else if(k==='i')IDX=+v});
  return ok}

    return true}).sort(function(a,b){return (b.rank==='S')-(a.rank==='S')})}

function cost(){
  var hk=S.h?by(HIKES,S.h):null, st=S.s?by(STAYS,S.s):null, rows=[], tt=0, af=0;
  if(S.sp.indexOf('s-kurobe')>=0)af=16480; else if(hk)af=AL[hk.alpen]||0;
  if(af){rows.push(['ケーブルカーとバス',af]); tt+=af}
  if(st){rows.push(['宿代（2食つき）',st.price]); tt+=st.price}
  var of_=0; S.on.forEach(function(i){var o=by(ONSENS,i); if(!o)return;
    if(st&&o.stayId===st.id)return; of_+=o.fee});
  if(of_){rows.push(['温泉',of_]); tt+=of_}
  var dr=route()==='tokai'?5500:5000; rows.push(['高速代とガソリン',dr]); tt+=dr;
  var fd=S.fd.length*1800; if(fd){rows.push(['食事',fd]); tt+=fd}
  return {rows:rows,total:tt}}

/* ============ 行程 ============ */
function fmt(m){var h=Math.floor(m/60),x=Math.round(m%60); if(x===60){h++;x=0} return h+':'+(x<10?'0':'')+x}
function r10(m){return Math.round(m/10)*10}
function Sq(){this.i=[]}
Sq.prototype.add=function(m,a){if(m>0)this.i.push([r10(m),a]);return this};
Sq.prototype.mk=function(a){this.i.push([0,a]);return this};
Sq.prototype.fx=function(t,a){this.i.push([-1,a,t]);return this};
Sq.prototype.tot=function(){var s=0;this.i.forEach(function(x){if(x[0]>0)s+=x[0]});return s};
Sq.prototype.rd=function(st){var t=st,o=[];this.i.forEach(function(x){
  if(x[0]===-1)o.push({t:x[2],a:x[1]});
  else if(x[0]===0)o.push({t:fmt(t),a:x[1]});
  else {o.push({t:fmt(t),a:x[1]});t+=x[0]}});this.end=t;return o};
function sched(){
  var hk=S.h?by(HIKES,S.h):null, st=S.s?by(STAYS,S.s):null;
  var dr=route()==='tokai'?330:300;
  var sum=st&&(st.area==='summit'||st.area==='mountain'), two=hk&&hk.two;
  var sp=S.sp.map(function(i){return by(SPOTS,i)}).filter(Boolean);
  var fo=S.fd.map(function(i){return by(FOODS,i)}).filter(Boolean);
  var os=S.on.map(function(i){return by(ONSENS,i)}).filter(Boolean);
  var gk=sp.filter(function(o){return o.area==='gokayama'}), ni=sp.filter(function(o){return o.night});
  var uS={},uF={},uO={},done=false;
  function tS(f){for(var i=0;i<sp.length;i++){var o=sp[i];if(!uS[o.id]&&!o.night&&f(o)){uS[o.id]=1;return o}}return null}
  function tF(f){for(var i=0;i<fo.length;i++){var o=fo[i];if(!uF[o.id]&&f(o)){uF[o.id]=1;return o}}return null}
  function tO(f){for(var i=0;i<os.length;i++){var o=os[i];if(!uO[o.id]&&f(o)){uO[o.id]=1;return o}}return null}
  function T(){return true}
  var A=new Sq(),B=new Sq(),s1,s2;
  if(two){ s1=210;
    A.add(dr,'車で立山駅へ');
    if(gk.length){var g=tS(function(o){return o.area==='gokayama'});if(g)A.add(90,g.n)}
    A.add(40,'駐車して、きっぷを受け取る');
    A.add(70,'ケーブルカーとバスで山の上へ');
    A.add(hk.h1||420,hk.d1||'1日目の山歩き');
    A.mk('宿に到着、夕ごはん');
    A.fx('夜',st&&st.id==='dainichigoya'?'ランプの灯りとギターの音':'星空を見る');
  } else if(sum){ s1=240;
    A.add(dr,'車で立山駅へ');
    if(gk.length){var g2=tS(function(o){return o.area==='gokayama'});if(g2)A.add(90,g2.n)}
    var sb=tS(function(o){return o.id==='s-sabo'}); if(sb)A.add(60,sb.n);
    A.add(40,'駐車して、きっぷを受け取る');
    A.add(70,'ケーブルカーとバスで山の上へ');
    var lf=tF(function(o){return o.area==='tateyama'});
    A.add(50,lf?(lf.n+'でお昼ごはん'):'山の上でお昼ごはん');
    A.add(150,'池のまわりを散歩（ライチョウ探し）');
    A.mk('宿にチェックイン');
    var so=tO(function(o){return o.area==='summit'});
    A.fx('夕方',so?(so.n+'に入る'):(st&&st.onsen?'宿のお風呂に入る':'ひと休み'));
    A.fx('夜','夕ごはんと星空');
  } else {
    A.add(dr,'車で立山方面へ');
    if(gk.length){var g3=tS(function(o){return o.area==='gokayama'});if(g3)A.add(120,g3.n)}
    var l2=tF(function(o){return o.area==='gokayama'||o.area==='tateyama'});
    if(l2)A.add(60,l2.n+'でお昼ごはん');
    if(hk&&hk.alpen==='none'&&hk.tier<=2){A.add(hk.hrs*60,hk.n);done=true}
    var x1=tS(function(o){return !o.heavy&&o.id!=='s-shomyo'}); if(x1)A.add(x1.hrs*60,x1.n);
    var x2=tS(function(o){return !o.heavy&&o.id!=='s-shomyo'}); if(x2)A.add(x2.hrs*60,x2.n);
    var fo2=tO(function(o){return o.area==='foot'}); if(fo2)A.add(90,fo2.n+'に入る');
    A.mk('宿にチェックイン、夕ごはん');
    ni.forEach(function(o){A.fx(o.id==='s-hanabi'?'19:20':'夜',o.n)});
    s1=Math.max(300,Math.min(540,1050-A.tot()));
  }
  var d1=A.rd(s1), hut=two?(s1+A.tot()):null;
  d1.unshift({t:fmt(s1),a:'大津京に集合、出発'});
  if(two){ s2=300; B.add(60,'起きて朝ごはん、出発の準備');
    B.add(hk.h2||240,hk.d2||'2日目の山歩き');
    if(hk.id==='dainichi3')B.add(60,'称名滝を見る');
    var o2=tO(T); if(o2)B.add(90,o2.n+'に入る');
    var f2=tF(function(o){return o.area!=='gokayama'}); if(f2)B.add(80,f2.n+'を食べる');
  } else if(sum){ s2=270;
    B.add(40,'起きて朝ごはん');
    B.add((hk?hk.hrs:2)*60,hk?hk.n:'山の上を散歩');
    var o3=tO(function(o){return o.area==='summit'}); if(o3)B.add(80,o3.n+'に入る');
    B.add(70,'バスとケーブルカーで下山');
    var o4=tO(function(o){return o.area==='foot'}); if(o4)B.add(80,o4.n+'に入る');
    if(!uS['s-shomyo']&&S.sp.indexOf('s-shomyo')>=0){uS['s-shomyo']=1;B.add(110,'称名滝を見る')}
    var f3=tF(function(o){return o.area!=='gokayama'}); if(f3)B.add(80,f3.n+'を食べる');
    var f3b=tF(function(o){return o.area!=='gokayama'}); if(f3b)B.add(50,f3b.n+'も食べる');
    var x3=tS(function(o){return !o.heavy}); if(x3)B.add(x3.hrs*60,x3.n);
    var o5=tO(function(o){return o.area==='far'}); if(o5)B.add(80,o5.n+'に入る');
  } else {
    s2=(hk&&!done&&hk.alpen!=='none')?300:360;
    B.add(60,'起きて朝ごはん');
    if(hk&&!done){
      if(hk.alpen!=='none'){
        B.add(40,'立山駅へ移動、きっぷを受け取る');
        B.add(hk.alpen==='midagahara'?40:70,'ケーブルカーとバスで上へ');
        B.add(hk.hrs*60,hk.n);
        var o6=tO(function(o){return o.area==='summit'}); if(o6)B.add(80,o6.n+'に入る');
        B.add(hk.alpen==='midagahara'?40:70,'バスとケーブルカーで下山');
      } else B.add(hk.hrs*60,hk.n);
      done=true}
    if(!uS['s-shomyo']&&S.sp.indexOf('s-shomyo')>=0){uS['s-shomyo']=1;B.add(110,'称名滝を見る')}
    var x4=tS(T); if(x4)B.add(x4.hrs*60,x4.n);
    var o7=tO(T); if(o7)B.add(90,o7.n+'に入る');
    var f5=tF(T); if(f5)B.add(80,f5.n+'を食べる');
    var x5=tS(function(o){return !o.heavy}); if(x5)B.add(x5.hrs*60,x5.n);
    var f6=tF(T); if(f6)B.add(50,f6.n+'も食べる');
  }
  var d2=B.rd(s2), dep=B.end;
  d2.push({t:fmt(dep),a:'帰ります（大津京に '+fmt(dep+dr)+' ごろ着）'});
  var left=[];
  sp.forEach(function(o){if(!uS[o.id]&&!o.night)left.push(o.n)});
  os.forEach(function(o){if(!uO[o.id])left.push(o.n)});
  fo.forEach(function(o){if(!uF[o.id])left.push(o.n)});
  return {d1:d1,d2:d2,arrive:dep+dr,left:left,hut:hut,start:s1}}

/* ============ 注意 ============ */
function notes(){
  var W=[],hk=S.h?by(HIKES,S.h):null,st=S.s?by(STAYS,S.s):null;
  var sum=st&&(st.area==='summit'||st.area==='mountain'), sc=sched();
  if(sum&&S.sp.indexOf('s-hanabi')>=0)W.push('<b>花火には行けません。</b>山の上に泊まると、夜にふもとへ下りられないためです。花火に行くなら、ふもとの宿に変えてください。');
  if(S.sp.indexOf('s-kurobe')>=0&&hk&&hk.tier>=2)W.push('<b>黒部ダムと山登りは同じ日にできません。</b>ダムは往復で6〜7時間かかります。どちらかを外してください。');
  if(!sum&&st&&hk&&hk.alpen==='murodo'&&hk.tier>=3)W.push('<b>かなり早起きになります。</b>ふもとに泊まってこのコースを歩くには、朝いちばんのケーブルカーに乗る必要があります。');
  if(sc.hut&&sc.hut>1020)W.push('<b>宿に着くのが '+fmt(sc.hut)+' になります。</b>山の宿の夕ごはんは17〜18時なので間に合いません。前の日の夜からふもとに泊まると解決します。');
  if(sc.arrive>1410)W.push('<b>家に着くのが '+fmt(sc.arrive)+' ごろになります。</b>寄り道を1つ減らすと早くなります。');
  if(sc.left.length)W.push('時間が足りず、<b>'+sc.left.join('・')+'</b> は行程に入りませんでした。');
  return W}

/* ============ 結果 ============ */
function result(){
  var hk=S.h?by(HIKES,S.h):null, st=S.s?by(STAYS,S.s):null;
  var c=cost(), sc=sched(), W=notes();
  var h='<div class="rz"><div class="ok">🏔</div><h1>プランができました</h1>'
   +'<p>8月22日（土）〜 23日（日）／4人</p></div>';
  h+='<div class="plan">'
   +'<div class="lb">やること</div><div class="v1">'+(hk?hk.n:'—')+'</div><div class="v2">'+(hk?hk.k:'')+'</div>'
   +'<hr><div class="lb">泊まるところ</div><div class="v1">'+(st?st.n:'—')+'</div><div class="v2">'+(st?st.k+'（2食つき）':'')+'</div>'
   +'<hr><div class="lb">1人あたり</div><div class="money"><b>'+yen(c.total)+'</b><span>4人で '+yen(c.total*4)+'</span></div>'
   +'</div>';
  W.forEach(function(x){h+='<div class="note w"><span class="i">⚠️</span><span>'+x+'</span></div>'});
  h+='<h2 class="s">当日の流れ</h2>';
  h+='<div class="dayl">1日目　8月22日（土）</div><ul class="tl">';
  sc.d1.forEach(function(r){h+='<li><span class="tm">'+r.t+'</span><span class="ac">'+r.a+'</span></li>'});
  h+='</ul><div class="dayl">2日目　8月23日（日）</div><ul class="tl">';
  sc.d2.forEach(function(r){h+='<li><span class="tm">'+r.t+'</span><span class="ac">'+r.a+'</span></li>'});
  h+='</ul>';
  h+='<h2 class="s">お金の内訳（1人分）</h2><ul class="tl">';
  c.rows.forEach(function(r){h+='<li><span class="ac">'+r[0]+'</span><span class="tm" style="width:auto;text-align:right">'+yen(r[1])+'</span></li>'});
  h+='<li><span class="ac" style="font-weight:800">合計</span><span class="tm" style="width:auto;text-align:right;font-size:1rem">'+yen(c.total)+'</span></li></ul>';
  h+='<div class="note"><span class="i">·</span><span>高速代とガソリンは4人で割った金額です。食事は1回1,800円で計算しています。おみやげ代は入っていません。</span></div>';
  var pick=[]; S.on.forEach(function(i){var o=by(ONSENS,i);if(o)pick.push(o.n)});
  S.fd.forEach(function(i){var o=by(FOODS,i);if(o)pick.push(o.n)});
  S.sp.forEach(function(i){var o=by(SPOTS,i);if(o)pick.push(o.n)});
  if(pick.length)h+='<h2 class="s">選んだもの</h2><div class="pills">'+pick.map(function(n){return '<span>'+n+'</span>'}).join('')+'</div>';
  h+='<h2 class="s">みんなに送る</h2><div class="acts">'
   +'<button class="p" onclick="cpT()">プランをコピーして送る</button>'
   +'<button onclick="cpL()">この画面のリンクをコピー</button>'
   +'<button onclick="again()">もう一度やり直す</button></div>';
  h+='<div class="foot">くわしい資料もあります<br>'
   +'<a href="guide.html">写真と図で見る</a>　<a href="notes.html">文字で読む</a></div>';
  return h}

/* ============ 共有 ============ */
function txt(){
  var hk=S.h?by(HIKES,S.h):null, st=S.s?by(STAYS,S.s):null, c=cost(), sc=sched(), o=[];
  o.push('【立山 8/22(土)-23(日) 4人】','');
  o.push('やること：'+(hk?hk.n:'—'));
  o.push('泊まる　：'+(st?st.n:'—'));
  o.push('1人　　：'+yen(c.total)+'（4人で'+yen(c.total*4)+'）','');
  o.push('■1日目 8/22(土)');
  sc.d1.forEach(function(r){o.push(r.t+' '+r.a)});
  o.push('','■2日目 8/23(日)');
  sc.d2.forEach(function(r){o.push(r.t+' '+r.a)});
  var W=notes(); if(W.length){o.push('','■気をつけること');
    W.forEach(function(x){o.push('・'+x.replace(/<[^>]+>/g,''))})}
  return o.join('\n')}
function cp(s,m){var t=document.getElementById('ta'); t.value=s; t.style.left='0';
  t.select(); t.setSelectionRange(0,999999); var ok=false;
  try{ok=document.execCommand('copy')}catch(e){}
  t.style.left='-9999px';
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(s).then(function(){toast(m)},function(){toast('コピーできませんでした')});return}
  toast(ok?m:'コピーできませんでした')}
function cpT(){cp(txt(),'コピーしました')}
function cpL(){wURL();cp(location.href,'リンクをコピーしました')}
function again(){S={g:null,e:null,y:null,h:null,s:null,on:[],fd:[],sp:[]};IDX=0;
  history.replaceState(null,'',location.pathname);screen()}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  setTimeout(function(){t.classList.remove('on')},2000)}

/* ============ 起動 ============ */
(function(){ var had=rURL(); BOOT=false;
  if(!had)IDX=0;
  else{ if(IDX>=4&&!S.g)IDX=1; if(IDX>=8&&!S.h)IDX=4; if(IDX>STEPS.length-1)IDX=STEPS.length-1 }
  screen() })();
</script>
