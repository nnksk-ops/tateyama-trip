<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>立山プランビルダー</title>
<style>
:root{
  --bg:#101315; --sf:#181c1f; --sf2:#1f2427; --bd:#2a3034; --bd2:#3a4247;
  --tx:#e9ebec; --mu:#8d969b; --mu2:#666e73;
  --ac:#e0a83c; --rd:#d97066;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;padding-bottom:84px}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
.w{max-width:1000px;margin:0 auto;padding:0 16px}

#sitenav{background:#0c0f11;border-bottom:1px solid var(--bd);padding:7px 16px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
#sitenav a{color:var(--mu);text-decoration:none;font-size:.75rem;padding:3px 10px;border-radius:999px;white-space:nowrap}
#sitenav a:hover{color:var(--tx)}
#sitenav a.here{background:var(--sf2);color:var(--tx)}
#sitenav a.home{color:var(--ac);font-weight:700}

header{padding:16px 0 12px}
h1{font-size:1.15rem;margin:0;font-weight:700}
header p{margin:2px 0 0;color:var(--mu);font-size:.78rem}

.steps{display:flex;margin:0 0 4px;position:sticky;top:0;z-index:30;
  background:rgba(16,19,21,.97);backdrop-filter:blur(8px);padding:10px 0 12px}
.steps button{flex:1;background:none;border:none;border-bottom:2px solid var(--bd);
  color:var(--mu2);font-size:.82rem;padding:7px 4px;transition:.15s}
.steps button .n{display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--bd);
  color:var(--mu);align-items:center;justify-content:center;font-size:.7rem;margin-right:6px;font-weight:700}
.steps button.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:700}
.steps button.on .n{background:var(--ac);color:#221800}
.steps button.done{color:var(--mu)}
.steps button.done .n{background:var(--bd2);color:var(--tx)}
.steps button:disabled{opacity:.35}

section{display:none;padding:12px 0 24px}
section.on{display:block}

.q{margin:0 0 26px}
.q h2{font-size:.95rem;margin:0 0 9px;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.opts button{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:13px 14px;
  text-align:left;color:var(--tx);transition:.12s;display:flex;gap:10px;align-items:flex-start}
.opts button:hover{border-color:var(--bd2)}
.opts button.sel{border-color:var(--ac);background:#211d15}
.opts .i{font-size:1.15rem;line-height:1.2;flex:none}
.opts .t{font-size:.88rem;font-weight:600;line-height:1.4;display:block}
.opts .s{font-size:.74rem;color:var(--mu);line-height:1.45;display:block;margin-top:2px}
.opts button.sel .t{color:var(--ac)}

.cat{margin:0 0 30px}
.cat > h2{font-size:.95rem;margin:0 0 3px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.cat > h2 em{font-style:normal;font-size:.72rem;color:var(--mu2);font-weight:400}
.cat > h2 .cnt{margin-left:auto;font-size:.74rem;color:var(--ac);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px;margin-top:9px}
.c{background:var(--sf);border:1.5px solid var(--bd);border-radius:10px;overflow:hidden;
  padding:0;text-align:left;color:var(--tx);transition:.12s;position:relative}
.c:hover{border-color:var(--bd2)}
.c.sel{border-color:var(--ac)}
.c .ph{aspect-ratio:3/2;background:var(--sf2);overflow:hidden}
.c .ph img{width:100%;height:100%;object-fit:cover;transition:.25s}
.c:not(.sel) .ph img{filter:saturate(.7) brightness(.8)}
.c:hover .ph img,.c.sel .ph img{filter:none}
.c .b{padding:8px 10px 10px}
.c .n{font-size:.83rem;font-weight:600;line-height:1.35}
.c .k{font-size:.72rem;color:var(--mu);margin-top:2px;font-variant-numeric:tabular-nums}
.c .dots{margin-top:5px}
.c .dr{font-size:.66rem;color:var(--mu2);display:flex;gap:5px;align-items:center}
.c .dr b{font-weight:400;width:30px;flex:none}
.dt{letter-spacing:.5px;color:var(--tx)}
.dt i{color:var(--bd2);font-style:normal}
.c .chk{position:absolute;top:6px;right:6px;width:21px;height:21px;border-radius:50%;
  background:var(--ac);color:#221800;font-size:.72rem;font-weight:900;display:none;
  align-items:center;justify-content:center}
.c.sel .chk{display:flex}
.c .rec{position:absolute;top:6px;left:6px;background:rgba(16,19,21,.85);color:var(--ac);
  font-size:.63rem;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.05em}

.dp{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:13px 15px;margin-top:10px}
.dp h4{margin:0 0 4px;font-size:.88rem}
.dp .m{color:var(--ac);font-size:.74rem;margin-bottom:6px;font-variant-numeric:tabular-nums}
.dp p{margin:0 0 8px;font-size:.81rem;color:var(--mu);line-height:1.65}
.dp .rt{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 8px;font-size:.71rem;color:var(--mu2)}
.dp a{color:var(--mu);font-size:.75rem;text-decoration:none;margin-right:12px;border-bottom:1px solid var(--bd2)}
.dp a:hover{color:var(--tx)}
.picked{display:flex;gap:5px;flex-wrap:wrap}
.picked span{background:var(--sf2);border:1px solid var(--bd2);border-radius:999px;
  padding:2px 10px;font-size:.72rem;color:var(--mu)}

.hd{border-bottom:1px solid var(--bd);padding-bottom:14px;margin-bottom:6px}
.hd h2{font-size:1.25rem;margin:0 0 3px;font-weight:700}
.hd .s{color:var(--mu);font-size:.78rem}
.hd .price{margin-top:10px;font-size:1.5rem;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}
.hd .price small{font-size:.72rem;color:var(--mu);font-weight:400;margin-left:6px}

.al{display:flex;gap:9px;padding:9px 12px;border-radius:8px;margin:7px 0;font-size:.8rem;
  background:var(--sf);border-left:2px solid var(--bd2);color:var(--mu);line-height:1.6}
.al.w{border-left-color:var(--rd);background:#1e1618;color:#e5c3c0}
.al .ic{flex:none;font-size:.85rem;line-height:1.5}
.al b{color:var(--tx)}
.al a{color:inherit}
details.more{margin:8px 0}
details.more summary{font-size:.78rem;color:var(--mu);cursor:pointer;padding:5px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"＋ ";color:var(--ac)}
details.more[open] summary::before{content:"− "}

h3.sec{font-size:.83rem;margin:26px 0 8px;color:var(--mu);font-weight:700;
  letter-spacing:.06em;display:flex;align-items:center;gap:10px}
h3.sec::after{content:"";flex:1;height:1px;background:var(--bd)}
h3.sec .tg{font-size:.72rem;color:var(--mu2);font-weight:400;cursor:pointer;letter-spacing:0;order:3}
h3.sec .tg:hover{color:var(--tx)}

.day{font-size:.76rem;font-weight:700;color:var(--ac);margin:14px 0 4px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:12px;padding:5px 0;font-size:.84rem;border-bottom:1px solid #1c2124}
.tl li:last-child{border:none}
.tl .t{flex:none;width:96px;color:var(--mu);font-variant-numeric:tabular-nums;font-size:.78rem}
.tl small{display:block;color:var(--mu2);font-size:.74rem;line-height:1.5}
body:not(.verbose) .tl small{display:none}
body:not(.verbose) ol.ck small{display:none}

table.cost{width:100%;border-collapse:collapse;font-size:.83rem}
table.cost td{padding:7px 0;border-bottom:1px solid #1c2124;color:var(--mu)}
table.cost td:first-child{color:var(--tx)}
table.cost td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--tx)}
table.cost tr.t td{border-bottom:none;border-top:1px solid var(--bd2);padding-top:11px;
  font-weight:700;color:var(--ac);font-size:.95rem}

ol.ck{margin:0;padding:0;list-style:none;counter-reset:c}
ol.ck li{counter-increment:c;padding:8px 0 8px 26px;position:relative;font-size:.84rem;border-bottom:1px solid #1c2124}
ol.ck li:last-child{border:none}
ol.ck li::before{content:counter(c);position:absolute;left:0;top:9px;width:17px;height:17px;
  border:1px solid var(--bd2);border-radius:4px;color:var(--mu2);font-size:.66rem;
  display:flex;align-items:center;justify-content:center}
ol.ck small{display:block;color:var(--mu2);font-size:.75rem;margin:1px 0 3px;line-height:1.5}
ol.ck a{color:var(--mu);font-size:.74rem;text-decoration:none;margin-right:11px;border-bottom:1px solid var(--bd2)}
ol.ck a:hover{color:var(--tx)}

.sh{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:15px;margin:22px 0 0}
.sh .row{display:flex;gap:7px;flex-wrap:wrap}
.sh button{border:1px solid var(--bd2);background:var(--sf2);color:var(--tx);
  border-radius:8px;padding:9px 15px;font-size:.81rem;font-weight:600}
.sh button.p{background:var(--ac);color:#221800;border-color:var(--ac)}
.sh textarea{width:100%;height:110px;margin-top:10px;background:var(--bg);color:var(--mu);
  border:1px solid var(--bd);border-radius:8px;padding:9px;font-size:.73rem;line-height:1.55;
  font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.sh .n{font-size:.74rem;color:var(--mu2);margin-top:9px;line-height:1.6}

.bar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(20,24,26,.97);
  backdrop-filter:blur(10px);border-top:1px solid var(--bd2);padding:9px 16px}
.bar .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:11px}
.bar .l{flex:1;min-width:0;font-size:.78rem;color:var(--mu);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.bar .l b{color:var(--tx);font-weight:600}
.bar .p{font-size:.85rem;color:var(--ac);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar button{border:none;border-radius:8px;padding:9px 17px;font-size:.84rem;font-weight:700;white-space:nowrap}
.bar .go{background:var(--ac);color:#221800}
.bar .go:disabled{background:var(--bd);color:var(--mu2)}
.bar .re{background:none;color:var(--mu2);border:1px solid var(--bd);padding:8px 12px;font-weight:400}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);
  color:var(--bg);padding:8px 18px;border-radius:999px;font-size:.82rem;font-weight:700;
  z-index:99;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1}
@media(max-width:560px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px}
  .steps button{font-size:.72rem}.steps button .n{margin-right:3px}
  .tl .t{width:78px}
  .bar .l{display:none}
}
</style>
</head>

    var l2=tF(function(o){return o.area==='gokayama'||o.area==='tateyama'});
    if(l2)A.add(60,'昼食：'+l2.n,l2.k);
    if(hk&&hk.alpen==='none'&&hk.tier<=2){A.add(hk.hrs*60,hk.n,'アルペンルート不要なので初日に');done=true}
    var s1=tS(function(o){return !o.heavy&&o.id!=='s-shomyo'}); if(s1)A.add(s1.hrs*60,s1.n,s1.k);
    var s2=tS(function(o){return !o.heavy&&o.id!=='s-shomyo'}); if(s2)A.add(s2.hrs*60,s2.n,s2.k);
    var fo2=tO(function(o){return o.area==='foot'}); if(fo2)A.add(90,'温泉：'+fo2.n,fo2.k);
    A.mk('宿にチェックイン・夕食',st?st.n:'');
    ni.forEach(function(o){A.fx(o.id==='s-hanabi'?'19:20〜':'夜',o.n,o.k)});
    st1=Math.max(300,Math.min(540,1050-A.tot()));
  }
  var d1=A.rd(st1), hut=two?(st1+A.tot()):null;
  d1.unshift({t:fmt(st1),a:'大津京 出発',s:'運転交代を前提に'+(st1<300?'早朝発':'朝発')});
  if(two){ st2=300; B.add(60,'起床・朝食・準備','');
    B.add(hk.h2||240,hk.d2||'登山 2日目','');
    if(hk.id==='dainichi3')B.add(60,'称名滝','落差350m・日本一。下山口がそのまま名所');
    var o2=tO(A_); if(o2)B.add(90,'温泉：'+o2.n,o2.k);
    var f2=tF(function(o){return o.area!=='gokayama'}); if(f2)B.add(80,'食事：'+f2.n,f2.k);
  } else if(sum){ st2=270;
    B.add(40,'起床・朝食','ご来光を狙うならこの時刻');
    B.add((hk?hk.hrs:2)*60,hk?hk.n:'室堂平 散策','絶景は午前中にしか手に入らない');
    var o3=tO(function(o){return o.area==='summit'}); if(o3)B.add(80,'温泉：'+o3.n,o3.k);
    B.add(70,'高原バス＋ケーブルカー → 立山駅','');
    var o4=tO(function(o){return o.area==='foot'}); if(o4)B.add(80,'温泉：'+o4.n,o4.k);
    if(!uS['s-shomyo']&&S.sp.indexOf('s-shomyo')>=0){uS['s-shomyo']=1;B.add(110,'称名滝','往復1時間30分')}
    var f3=tF(function(o){return o.area!=='gokayama'}); if(f3)B.add(80,'食事：'+f3.n,f3.k);
    var f3b=tF(function(o){return o.area!=='gokayama'}); if(f3b)B.add(50,'＋'+f3b.n,f3b.k);
    var s3=tS(function(o){return !o.heavy}); if(s3)B.add(s3.hrs*60,s3.n,s3.k);
    var o5=tO(function(o){return o.area==='far'}); if(o5)B.add(80,'温泉：'+o5.n,o5.k);
  } else {
    st2=(hk&&!done&&hk.alpen!=='none')?300:360;
    B.add(60,'起床・朝食','始発ケーブルを狙うなら早め');
    if(hk&&!done){
      if(hk.alpen!=='none'){
        B.add(40,'立山駅へ移動・乗車手続き','');
        B.add(hk.alpen==='midagahara'?40:70,hk.alpen==='midagahara'?'ケーブルカー＋バス → 弥陀ヶ原':'ケーブルカー＋高原バス → 室堂','');
        B.add(hk.hrs*60,hk.n,'午前中に歩き切る');
        var o6=tO(function(o){return o.area==='summit'}); if(o6)B.add(80,'温泉：'+o6.n,o6.k);
        B.add(hk.alpen==='midagahara'?40:70,'バス＋ケーブルカーで下山','');
      } else B.add(hk.hrs*60,hk.n,'アルペンルート不要');
      done=true;}
    if(!uS['s-shomyo']&&S.sp.indexOf('s-shomyo')>=0){uS['s-shomyo']=1;B.add(110,'称名滝','往復1時間30分')}
    var s4=tS(A_); if(s4)B.add(s4.hrs*60,s4.n,s4.k);
    var o7=tO(A_); if(o7)B.add(90,'温泉：'+o7.n,o7.k);
    var f5=tF(A_); if(f5)B.add(80,'食事：'+f5.n,f5.k);
    var s5=tS(function(o){return !o.heavy}); if(s5)B.add(s5.hrs*60,s5.n,s5.k);
    var f6=tF(A_); if(f6)B.add(50,'＋'+f6.n,f6.k);
  }
  var d2=B.rd(st2), dep=B.end;
  d2.push({t:fmt(dep),a:'帰路へ　大津京着 '+fmt(dep+dr)+'頃',s:'高速で約'+(dr/60).toFixed(1)+'時間'});
  var left=[];
  sp.forEach(function(o){if(!uS[o.id]&&!o.night)left.push(o.n)});
  os.forEach(function(o){if(!uO[o.id])left.push(o.n)});
  fo.forEach(function(o){if(!uF[o.id])left.push(o.n)});
  return {d1:d1,d2:d2,depart:dep,arrive:dep+dr,left:left,hut:hut,start:st1};}

function warn(){
  var W=[],I=[],hk=S.h?by(HIKES,S.h):null,st=S.s?by(STAYS,S.s):null;
  var sum=st&&(st.area==='summit'||st.area==='mountain'), sc=sched();
  if(sum&&S.sp.indexOf('s-hanabi')>=0)W.push('<b>両立しません。</b>山の上に泊まると 8/22 19:20 の花火大会には行けません。');
  if(S.sp.indexOf('s-kurobe')>=0&&hk&&hk.tier>=2)W.push('<b>同日には入りません。</b>黒部ダムは往復6〜7時間。'+hk.n+'との同日実施は不可能です。');
  if(!sum&&st&&hk&&hk.alpen==='murodo'&&hk.tier>=3)W.push('<b>始発ケーブルが必須です。</b>麓泊で'+hk.n+'（'+hk.k+'）は時間が厳しい。千寿荘への変更を検討してください。');
  if(sc.hut&&sc.hut>1020)W.push('<b>山小屋の到着が '+fmt(sc.hut)+'。</b>夕食は17:00〜18:00が一般的なので間に合いません。前夜に千寿荘へ前泊するのが現実的です。');
  if(sc.arrive>1410)W.push('<b>帰宅が '+fmt(sc.arrive)+' 頃になります。</b>立ち寄りを1つ減らすか検討を。');
  if(S.on.length===0)W.push('温泉が選ばれていません。');
  if(st&&st.price>15000)W.push('宿泊費が予算1.5万円を超えています。');
  if(S.sp.indexOf('s-kurobe')>=0)I.push('黒部ダムを入れると運賃が <b>16,480円</b>（室堂往復より約8,300円増）になります。');
  if(hk&&hk.alpen==='midagahara')I.push('弥陀ヶ原の運賃6,000円は概算です。<a href="https://www.alpen-route.com/access_new/fare/person/index.php" target="_blank" rel="noopener">公式運賃</a>で確認を。');
  if(st&&st.id==='camp')I.push('キャンプ場泊はテント・寝袋・マットが必要です。入浴は雷鳥荘（800円）で。');
  if(sc.left.length)I.push('<b>行程に入り切らなかった候補</b>：'+sc.left.join('・'));
  I.push('<b>8月の制約</b>：黒部峡谷鉄道は猫又折り返しで欅平に行けません（全線再開10/1）。キャニオンルートは10/2開通。雪の大谷は6/25終了。');
  I.push('<b>この時期の強み</b>：8月下旬は紅葉の走り。高山植物と初期紅葉が同時に見られ、雷鳥もヒナ連れシーズン。');
  return {w:W,i:I};}

function chk(){
  var l=[],st=S.s?by(STAYS,S.s):null;
  l.push(['WEBきっぷを4人分予約','8/22は土曜で最混雑。当日券では予定の便に乗れないことがあります。',
    [['予約サイト','https://tateyama-kurobe-webservice.jp/AlpenTour/html/VW001W0010.html']]]);
  if(st)l.push([st.n+' を4人で予約',st.k+(st.area!=='foot'?'／山小屋は予約サイトに出ないことがあるので電話も併用':''),st.l]);
  l.push(['混雑予想カレンダーで8/22を確認','室堂直行バス（乗り換えなし）の運行有無もここで。',
    [['混雑予想','https://www.alpen-route.com/information/calendar/']]]);
  if(S.sp.indexOf('s-shiraiwa')>=0)l.push(['砂防体験学習会に申込','抽選・事前申込制。8/22–23の枠を早めに確認。',[['詳細','https://toyama.visit-town.com/visittour/karudera-taiken']]]);
  if(S.sp.indexOf('s-hanabi')>=0)l.push(['花火大会の開催を確認','8/22(土) 19:20〜の予定。駐車場も要確認。',[['花火まとめ','https://www.info-toyama.com/stories/fireworks-toyama']]]);
  if(S.fd.indexOf('f-table')>=0)l.push(['The Table を予約','事前予約推奨の店です。',[['立山町グルメ','https://www.info-toyama.com/articles/shiho-tateyamagourmet']]]);
  if(S.sp.indexOf('s-arimine')>=0)l.push(['有峰林道の通行時間規制を確認','',[['富山市観光協会','https://www.toyamashi-kankoukyoukai.jp/model-course/yakushidake-mountaineering-model-course/']]]);
  l.push(['装備：長袖＋フリース＋レインウェア','室堂は10〜20℃、立山駅は24〜32℃。脱げる前提で重ねる。',[['服装','https://www.alpen-route.com/information/advice_clothes.html']]]);
  l.push(['前夜と当日朝にライブカメラを確認','ガスの様子で行程を切り替える判断に。',[['室堂カメラ','https://www.alpen-route.com/live_camera/murodou.html']]]);
  return l;}

function r3(){
  var hk=S.h?by(HIKES,S.h):null,st=S.s?by(STAYS,S.s):null,c=cost(),sc=sched(),wn=warn(),ck=chk();
  var h='<div class="hd"><h2>'+(hk?hk.n:'—')+'　＋　'+(st?st.n:'—')+'</h2>'
   +'<div class="s">8月22日（土）〜23日（日）／4名／'+by(RT,S.r).t+'</div>'
   +'<div class="price">'+yen(c.total)+'<small>1人あたり ／ 4人で '+yen(c.total*4)+'</small></div></div>';
  wn.w.forEach(function(x){h+='<div class="al w"><span class="ic">⚠</span><span>'+x+'</span></div>'});
  if(wn.i.length){h+='<details class="more"><summary>そのほかの注意点（'+wn.i.length+'）</summary>';
    wn.i.forEach(function(x){h+='<div class="al"><span class="ic">·</span><span>'+x+'</span></div>'});h+='</details>'}
  h+='<h3 class="sec">行程<span class="tg" onclick="document.body.classList.toggle(\'verbose\')">補足の表示切替</span></h3>';
  h+='<div class="day">1日目 8/22（土）</div><ul class="tl">';
  sc.d1.forEach(function(r){h+='<li><span class="t">'+r.t+'</span><span>'+r.a+(r.s?'<small>'+r.s+'</small>':'')+'</span></li>'});
  h+='</ul><div class="day">2日目 8/23（日）</div><ul class="tl">';
  sc.d2.forEach(function(r){h+='<li><span class="t">'+r.t+'</span><span>'+r.a+(r.s?'<small>'+r.s+'</small>':'')+'</span></li>'});
  h+='</ul>';
  h+='<h3 class="sec">費用</h3><table class="cost">';
  c.rows.forEach(function(r){h+='<tr><td>'+r[0]+'</td><td>'+yen(r[2])+'</td></tr>'});
  h+='<tr class="t"><td>1人あたり</td><td>'+yen(c.total)+'</td></tr></table>';
  h+='<div class="al"><span class="ic">·</span><span>高速・ガソリンは1台割り勘、食事は1件1,800円で機械的に計算。土産・行動食は含みません。</span></div>';
  h+='<h3 class="sec">予約・準備</h3><ol class="ck">';
  ck.forEach(function(x){h+='<li><b>'+x[0]+'</b>'+(x[1]?'<small>'+x[1]+'</small>':'')
    +(x[2]||[]).map(function(a){return '<a href="'+a[1]+'" target="_blank" rel="noopener">'+a[0]+'</a>'}).join('')+'</li>'});
  h+='</ol>';
  var pick=[]; if(hk)pick.push(hk.n); if(st)pick.push(st.n);
  S.on.forEach(function(i){var o=by(ONSENS,i);if(o)pick.push(o.n)});
  S.fd.forEach(function(i){var o=by(FOODS,i);if(o)pick.push(o.n)});
  S.sp.forEach(function(i){var o=by(SPOTS,i);if(o)pick.push(o.n)});
  h+='<h3 class="sec">選んだもの（'+pick.length+'）</h3><div class="picked">'
    +pick.map(function(n){return '<span>'+n+'</span>'}).join('')+'</div>';
  h+='<div class="sh"><div class="row">'
   +'<button class="p" onclick="cpL()">リンクをコピー</button>'
   +'<button onclick="cpT()">テキストでコピー</button>'
   +'<button onclick="window.print()">印刷 / PDF</button></div>'
   +'<textarea readonly>'+txt().replace(/</g,'&lt;')+'</textarea>'
   +'<div class="n">リンクは選択内容がURLに入ります。LINEに投げるならテキストのほうが読みやすいです。</div></div>';
  document.getElementById('s3').innerHTML=h;}

function txt(){
  var hk=S.h?by(HIKES,S.h):null,st=S.s?by(STAYS,S.s):null,c=cost(),sc=sched(),o=[];
  o.push('■ 立山 一泊二日（2026/8/22土〜23日・4名・大津京発）','');
  o.push('メイン：'+(hk?hk.n+'（'+hk.k+'）':'未選択'));
  o.push('宿　　：'+(st?st.n+'（'+st.k+'）':'未選択'));
  if(S.on.length)o.push('温泉　：'+S.on.map(function(i){var x=by(ONSENS,i);return x?x.n:''}).join('、'));
  if(S.fd.length)o.push('食　　：'+S.fd.map(function(i){var x=by(FOODS,i);return x?x.n:''}).join('、'));
  if(S.sp.length)o.push('観光　：'+S.sp.map(function(i){var x=by(SPOTS,i);return x?x.n:''}).join('、'));
  o.push('','--- 1日目 8/22(土) ---');
  sc.d1.forEach(function(r){o.push(r.t+'　'+r.a)});
  o.push('','--- 2日目 8/23(日) ---');
  sc.d2.forEach(function(r){o.push(r.t+'　'+r.a)});
  o.push('','--- 費用（1人）---');
  c.rows.forEach(function(r){o.push('・'+r[0]+'：'+yen(r[2]))});
  o.push('合計 '+yen(c.total)+'（4人で'+yen(c.total*4)+'）','');
  o.push('--- 予約するもの ---');
  chk().forEach(function(x,i){o.push((i+1)+'. '+x[0])});
  o.push('','※8月は黒部峡谷鉄道が猫又折り返しで欅平に行けません。');
  return o.join('\n');}
function cp(s,m){var t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';
  document.body.appendChild(t);t.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}
  document.body.removeChild(t);
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(s).then(function(){toast(m)},function(){toast('下の欄から手動でコピーしてください')});return}
  toast(ok?m:'下の欄から手動でコピーしてください')}
function cpL(){wURL();cp(location.href,'リンクをコピーしました')}
function cpT(){cp(txt(),'テキストをコピーしました')}
function toast(m){var t=document.getElementById('tst');t.textContent=m;t.classList.add('on');
  setTimeout(function(){t.classList.remove('on')},2000)}

function ok1(){return !!(S.g&&S.y&&S.e)}
function ok2(){return !!(S.h&&S.s)}
function go(n){
  if(n>=2&&!ok1()){toast('4つ選んでください');return}
  if(n>=3&&!ok2()){toast('登山と宿を選んでください');return}
  STEP=n;
  [1,2,3].forEach(function(i){
    document.getElementById('s'+i).classList.toggle('on',i===n);
    var t=document.getElementById('t'+i);
    t.classList.toggle('on',i===n); t.classList.toggle('done',i<n);});
  document.getElementById('t2').disabled=!ok1();
  document.getElementById('t3').disabled=!ok2();
  if(n===2)r2(); if(n===3)r3();
  window.scrollTo(0,0); bar(); wURL();}
function next(){go(Math.min(3,STEP+1))}
function bar(){
  var b=document.getElementById('bb'),l=document.getElementById('bl'),p=document.getElementById('bp');
  document.getElementById('t2').disabled=!ok1();
  document.getElementById('t3').disabled=!ok2();
  var hk=S.h?by(HIKES,S.h):null,st=S.s?by(STAYS,S.s):null;
  if(STEP===1){
    var m=[]; if(!S.g)m.push('やりたいこと'); if(!S.y)m.push('宿の場所'); if(!S.e)m.push('歩ける時間');
    l.innerHTML=m.length?('あと：<b>'+m.join('・')+'</b>'):('候補 <b>'+hL().length+'コース</b>に絞り込みました');
    p.textContent=''; b.disabled=m.length>0; b.textContent='選ぶ →';
  } else if(STEP===2){
    l.innerHTML=(hk?'<b>'+hk.n+'</b>':'登山：未選択')+' ／ '+(st?'<b>'+st.n+'</b>':'宿：未選択')
      +' ／ 温泉'+S.on.length+'・食'+S.fd.length+'・観光'+S.sp.length;
    p.textContent=yen(cost().total); b.disabled=!ok2(); b.textContent='完成 →';
  } else {
    l.innerHTML='リンクかテキストで共有できます';
    p.textContent=yen(cost().total); b.disabled=false; b.textContent='選び直す';
    b.onclick=function(){go(2)}; return;}
  b.onclick=next;}
function reset(){S={g:null,y:null,e:null,r:'hokuriku',h:null,s:null,on:[],fd:[],sp:[]};DET={};
  history.replaceState(null,'',location.pathname+location.search);r1();go(1)}

(function(){var had=rURL(); r1(); BOOT=false;
  if(had&&ok1())go(ok2()?(STEP===3?3:2):2); else {STEP=1;go(1)}})();
</script>
